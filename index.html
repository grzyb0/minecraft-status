
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status serwera Minecraft</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111315;
    color: #eeeeee;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 8%;
    border-bottom: 1px solid #292d30;
    font-size: 20px;
    font-weight: bold;
}

main {
    max-width: 700px;
    margin: 90px auto;
    padding: 0 20px;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.description {
    color: #92989e;
    margin-bottom: 35px;
}

.server {
    background: #191c1f;
    border: 1px solid #303438;
    padding: 27px;
    border-radius: 8px;
}

.status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 28px;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #888;
}

.online .dot {
    background: #45c477;
}

.offline .dot {
    background: #e05252;
}

.error .dot {
    background: #e5a443;
}

.online #status {
    color: #45c477;
}

.offline #status {
    color: #e05252;
}

.error #status {
    color: #e5a443;
}

.line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 17px 0;
    border-top: 1px solid #303438;
    font-size: 14px;
}

.label {
    color: #92989e;
}

.value {
    color: #eeeeee;
    text-align: right;
}

.ip {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    background: #292e32;
    border: 1px solid #41474c;
    color: white;
    padding: 9px 13px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #383f44;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.refresh {
    margin-top: 22px;
    width: 100%;
    padding: 13px;
}

#updated {
    color: #92989e;
}

footer {
    text-align: center;
    color: #656b70;
    font-size: 12px;
    margin-top: 45px;
}

@media (max-width: 500px) {
    main {
        margin-top: 55px;
    }

    h1 {
        font-size: 26px;
    }

    .line {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    Serwer Minecraft
</header>

<main>

    <h1>Status serwera</h1>

    <p class="description">
        Sprawdź, czy serwer jest aktualnie dostępny.
    </p>

    <div class="server">

        <div class="status" id="statusBox">
            <span class="dot"></span>
            <span id="status">Sprawdzanie...</span>
        </div>

        <div class="line">
            <span class="label">Adres serwera</span>

            <div class="ip">
                <span class="value" id="address">
                    serwerminecraftminec.aternos.me
                </span>

                <button onclick="copyIP()" id="copyButton">
                    Kopiuj
                </button>
            </div>
        </div>

        <div class="line">
            <span class="label">Gracze online</span>
            <span class="value" id="players">-</span>
        </div>

        <div class="line">
            <span class="label">Wersja</span>
            <span class="value" id="version">-</span>
        </div>

        <div class="line">
            <span class="label">Ostatnia aktualizacja</span>
            <span class="value" id="updated">-</span>
        </div>

        <button class="refresh" id="refreshButton"
                onclick="checkServer()">
            Odśwież status
        </button>

    </div>

    <footer>
        Strona statusu serwera Minecraft
    </footer>

</main>

<script>

const SERVER = "serwerminecraftminec.aternos.me";

let checking = false;

async function checkServer() {

    if (checking) return;

    checking = true;

    const status = document.getElementById("status");
    const box = document.getElementById("statusBox");
    const players = document.getElementById("players");
    const version = document.getElementById("version");
    const updated = document.getElementById("updated");
    const refreshButton = document.getElementById("refreshButton");

    refreshButton.disabled = true;

    status.textContent = "Sprawdzanie...";
    box.className = "status";

    try {

        const response = await fetch(
            "https://api.mcstatus.io/v2/status/java/" +
            SERVER + "?_=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("API error: " + response.status);
        }

        const data = await response.json();

        // Odczyt wersji
        let versionName = "";

        if (typeof data.version === "string") {
            versionName = data.version;
        } else {
            versionName = data.version?.name_clean || "";
        }

        // Sprawdzenie statusu
        const isOnline =
            data.online === true &&
            versionName.toLowerCase() !== "offline";

        if (isOnline) {

            status.textContent = "ONLINE";
            box.className = "status online";

            players.textContent =
                (data.players?.online ?? 0) +
                "/" +
                (data.players?.max ?? "?");

            version.textContent =
                versionName || "Nieznana";

        } else {

            status.textContent = "OFFLINE";
            box.className = "status offline";

            players.textContent = "0/-";
            version.textContent = "Niedostępna";

        }

    } catch (error) {

        status.textContent = "BRAK DANYCH";
        box.className = "status error";

        players.textContent = "-";
        version.textContent = "Niedostępna";

        console.error(error);

    }

    updated.textContent =
        new Date().toLocaleTimeString("pl-PL");

    refreshButton.disabled = false;
    checking = false;
}

function copyIP() {

    navigator.clipboard.writeText(SERVER).then(() => {

        const button = document.getElementById("copyButton");

        button.textContent = "Skopiowano!";

        setTimeout(() => {
            button.textContent = "Kopiuj";
        }, 1500);

    }).catch(() => {
        alert("Nie udało się skopiować adresu.");
    });

}

// Pierwsze sprawdzenie
checkServer();

// Automatyczne sprawdzanie co 5 sekund
setInterval(checkServer, 5000);

</script>

</body>
</html>
