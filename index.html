
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serwer Minecraft</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #101114;
      color: #eeeeee;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 30px;
      background: #191a1f;
      border: 1px solid #2b2d35;
      border-radius: 12px;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 25px;
      font-weight: 600;
    }

    .status-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #22242b;
      border-radius: 8px;
      margin-bottom: 22px;
    }

    .dot {
      width: 11px;
      height: 11px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #888;
    }

    .online .dot {
      background: #35c46a;
    }

    .offline .dot {
      background: #e05252;
    }

    .error .dot {
      background: #e0a33d;
    }

    .status-text {
      font-size: 16px;
      font-weight: 600;
    }

    .online .status-text {
      color: #35c46a;
    }

    .offline .status-text {
      color: #e05252;
    }

    .error .status-text {
      color: #e0a33d;
    }

    .section {
      margin-top: 18px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: #999ba5;
      font-size: 13px;
    }

    .value {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .address-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .address {
      flex: 1;
      padding: 11px;
      background: #22242b;
      border-radius: 6px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    button {
      padding: 11px 14px;
      border: 0;
      border-radius: 6px;
      background: #343741;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #454956;
    }

    .refresh {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      background: #3b65c7;
      font-size: 14px;
    }

    .refresh:hover {
      background: #4b76d8;
    }

    .footer {
      margin-top: 18px;
      color: #777984;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Serwer Minecraft</h1>

    <div id="statusBox" class="status-box error">
      <span class="dot"></span>
      <span id="status" class="status-text">Sprawdzanie...</span>
    </div>

    <div class="section">
      <span class="label">Adres serwera</span>
      <div class="address-row">
        <div id="address" class="address">
          serwerminecraftminec.aternos.me
        </div>
        <button id="copyButton" onclick="copyIP()">Kopiuj</button>
      </div>
    </div>

    <div class="section">
      <span class="label">Gracze</span>
      <div id="players" class="value">-- / --</div>
    </div>

    <div class="section">
      <span class="label">Wersja Minecraft</span>
      <div id="version" class="value">--</div>
    </div>

    <div class="section">
      <span class="label">Ostatnie sprawdzenie</span>
      <div id="updated" class="value">--</div>
    </div>

    <button id="refreshButton" class="refresh" onclick="checkServer()">
      Odśwież status
    </button>

    <div class="footer">
      Status aktualizuje się automatycznie co 15 sekund.
    </div>
  </main>

  <script>
    const SERVER = "serwerminecraftminec.aternos.me";
    const API = "https://api.mcstatus.io/v2/status/java/";

    let checking = false;

    async function checkServer() {
      if (checking) return;

      checking = true;

      const statusBox = document.getElementById("statusBox");
      const status = document.getElementById("status");
      const players = document.getElementById("players");
      const version = document.getElementById("version");
      const updated = document.getElementById("updated");
      const refreshButton = document.getElementById("refreshButton");

      refreshButton.disabled = true;
      refreshButton.textContent = "Sprawdzanie...";

      try {
        const response = await fetch(
          API + SERVER + "?_=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Błąd API: " + response.status);
        }

        const data = await response.json();

        if (data.online === true) {
          statusBox.className = "status-box online";
          status.textContent = "ONLINE";

          const onlinePlayers = data.players?.online ?? 0;
          const maxPlayers = data.players?.max ?? "?";

          players.textContent =
            onlinePlayers + " / " + maxPlayers;

          version.textContent =
            data.version?.name_clean ??
            data.version?.name_raw ??
            "Nieznana";
        } else if (data.online === false) {
          statusBox.className = "status-box offline";
          status.textContent = "OFFLINE";

          players.textContent = "0 / 0";
          version.textContent = "Niedostępny";
        } else {
          throw new Error("Nieprawidłowa odpowiedź API");
        }

        updated.textContent =
          new Date().toLocaleTimeString("pl-PL");

      } catch (error) {
        statusBox.className = "status-box error";
        status.textContent = "Błąd sprawdzania";

        players.textContent = "-- / --";
        version.textContent = "--";

        updated.textContent =
          new Date().toLocaleTimeString("pl-PL");
      } finally {
        checking = false;
        refreshButton.disabled = false;
        refreshButton.textContent = "Odśwież status";
      }
    }

    async function copyIP() {
      const address = SERVER;
      const copyButton = document.getElementById("copyButton");

      try {
        await navigator.clipboard.writeText(address);
        copyButton.textContent = "Skopiowano";

        setTimeout(() => {
          copyButton.textContent = "Kopiuj";
        }, 1500);
      } catch (error) {
        copyButton.textContent = "Nie udało się";
      }
    }

    checkServer();
    setInterval(checkServer, 15000);
  </script>
</body>
</html>
