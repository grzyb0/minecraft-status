
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status serwera Minecraft</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #101522, #202c40);
    font-family: Arial, sans-serif;
    color: white;
}

.card {
    width: 90%;
    max-width: 450px;
    padding: 35px 25px;
    text-align: center;
    background: #1d2738;
    border: 1px solid #34445d;
    border-radius: 20px;
    box-shadow: 0 15px 50px #0008;
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aab8ce;
    margin-bottom: 30px;
}

#status {
    font-size: 30px;
    font-weight: bold;
    margin: 25px 0;
}

.online {
    color: #50e890;
}

.offline {
    color: #ff5555;
}

.info {
    background: #29364a;
    padding: 14px;
    border-radius: 10px;
    margin: 12px 0;
    color: #dce6f5;
}

button {
    margin-top: 20px;
    padding: 14px 25px;
    background: #5865f2;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #4752c4;
}

#updated {
    margin-top: 20px;
    font-size: 12px;
    color: #8796ac;
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #71819a;
}
</style>
</head>

<body>

<div class="card">

    <h1>Serwer Minecraft</h1>
    <div class="subtitle">Status serwera na żywo</div>

    <div id="status">Sprawdzam...</div>

    <div class="info" id="address">
        serwerminecraftminec.aternos.me
    </div>

    <div class="info" id="players">
        Pobieranie liczby graczy...
    </div>

    <div class="info" id="version">
        Wersja: sprawdzam...
    </div>

    <button onclick="checkServer()">Odśwież status</button>

    <div id="updated">Oczekiwanie...</div>

    <div class="footer">
        Minecraft Server Status
    </div>

</div>

<script>

const SERVER = "serwerminecraftminec.aternos.me";

async function checkServer() {

    const status = document.getElementById("status");
    const players = document.getElementById("players");
    const version = document.getElementById("version");
    const updated = document.getElementById("updated");

    status.textContent = "Sprawdzam...";
    status.className = "";

    try {

        const response = await fetch(
            "https://api.mcstatus.io/v2/status/java/" + SERVER
        );

        if (!response.ok) {
            throw new Error("Błąd API: " + response.status);
        }

        const data = await response.json();

        if (data.online === true) {

            status.textContent = "ONLINE";
            status.className = "online";

            players.textContent =
                "Gracze: " +
                data.players.online + "/" +
                data.players.max;

            version.textContent =
                "Wersja: " +
                (data.version?.name_clean || "Nieznana");

        } else {

            status.textContent = "OFFLINE";
            status.className = "offline";

            players.textContent = "Serwer jest wyłączony";
            version.textContent = "Wersja: niedostępna";

        }

    } catch (error) {

        status.textContent = "BŁĄD";
        status.className = "offline";

        players.textContent = "Nie udało się sprawdzić serwera";
        version.textContent = "Wersja: niedostępna";

        console.error(error);

    }

    updated.textContent =
        "Ostatnia aktualizacja: " +
        new Date().toLocaleTimeString("pl-PL");

}

checkServer();
setInterval(checkServer, 30000);

</script>

</body>
</html>
