
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status serwera Minecraft</title>

  <style>
    body {
      background: #12141c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    .card {
      background: #202431;
      max-width: 420px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
    }

    h1 { color: #62d98b; }

    #status {
      font-size: 26px;
      font-weight: bold;
      margin: 25px 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Minecraft Server</h1>

    <div id="status">Sprawdzam...</div>

    <p id="players"></p>
    <p id="address"></p>
    <p id="updated"></p>

    <button onclick="checkServer()">Odśwież status</button>
  </div>

  <script>
    const SERVER = "serwerminecraftminec.aternos.me";

    async function checkServer() {
      document.getElementById("status").textContent = "Sprawdzam...";
      document.getElementById("address").textContent = SERVER;

      try {
        const response = await fetch(
          `https://api.mcstatus.io/v2/status/java/${SERVER}`
        );

        const data = await response.json();

        if (data.online) {
          document.getElementById("status").textContent = "ONLINE";
          document.getElementById("players").textContent =
            `Gracze: ${data.players.online}/${data.players.max}`;
        } else {
          document.getElementById("status").textContent = "OFFLINE";
          document.getElementById("players").textContent =
            "Serwer jest wyłączony";
        }

      } catch (error) {
        document.getElementById("status").textContent =
          "Nie udało się sprawdzić statusu";
        document.getElementById("players").textContent = "";
      }

      document.getElementById("updated").textContent =
        "Ostatnie sprawdzenie: " + new Date().toLocaleTimeString("pl-PL");
    }

    checkServer();
    setInterval(checkServer, 30000);
  </script>
</body>
</html>
