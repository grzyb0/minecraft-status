
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serwer Minecraft</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111315;
    color: #eeeeee;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 8%;
    border-bottom: 1px solid #292d30;
    font-size: 20px;
    font-weight: bold;
}

main {
    max-width: 700px;
    margin: 90px auto;
    padding: 0 20px;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.description {
    color: #92989e;
    margin-bottom: 35px;
}

.server {
    background: #191c1f;
    border: 1px solid #303438;
    padding: 25px;
    border-radius: 8px;
}

.status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 25px;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #888;
}

.online .dot {
    background: #45c477;
}

.offline .dot {
    background: #e05252;
}

.online #status {
    color: #45c477;
}

.offline #status {
    color: #e05252;
}

.line {
    display: flex;
    justify-content: space-between;
    padding: 15px 0;
    border-top: 1px solid #303438;
    font-size: 14px;
}

.label {
    color: #92989e;
}

.value {
    color: #eeeeee;
}

.ip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

button {
    background: #292e32;
    border: 1px solid #41474c;
    color: white;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #383f44;
}

.refresh {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
}

footer {
    text-align: center;
    color: #656b70;
    font-size: 12px;
    margin-top: 45px;
}

@media (max-width: 500px) {
    main {
        margin-top: 55px;
    }

    h1 {
        font-size: 26px;
    }

    .ip {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    Serwer Minecraft
</header>

<main>

    <h1>Status serwera</h1>
    <p class="description">
        Sprawdź, czy serwer jest aktualnie dostępny.
    </p>

    <div class="server">

        <div class="status" id="statusBox">
            <span class="dot"></span>
            <span id="status">Sprawdzanie...</span>
        </div>

        <div class="line">
            <span class="label">Adres serwera</span>
            <div class="ip">
                <span class="value" id="address">
                    serwerminecraftminec.aternos.me
                </span>
                <button onclick="copyIP()">Kopiuj</button>
            </div>
        </div>

        <div class="line">
            <span class="label">Gracze online</span>
            <span class="value" id="players">-</span>
        </div>

        <div class="line">
            <span class="label">Wersja</span>
            <span class="value" id="version">-</span>
        </div>

        <div class="line">
            <span class="label">Ostatnia aktualizacja</span>
            <span class="value" id="updated">-</span>
        </div>

        <button class="refresh" onclick="checkServer()">
            Odśwież status
        </button>

    </div>

    <footer>
        Strona statusu serwera Minecraft
    </footer>

</main>

<script>
const SERVER = "serwerminecraftminec.aternos.me";

async function checkServer() {
    const status = document.getElementById("status");
    const box = document.getElementById("statusBox");
    const players = document.getElementById("players");
    const version = document.getElementById("version");
    const updated = document.getElementById("updated");

    status.textContent = "Sprawdzanie...";
    box.className = "status";

    try {
        const response = await fetch(
            "https://api.mcstatus.io/v2/status/java/" + SERVER
        );

        if (!response.ok) throw new Error("API error");

        const data = await response.json();

        if (data.online) {
            status.textContent = "ONLINE";
            box.classList.add("online");

            players.textContent =
                data.players.online + "/" + data.players.max;

            version.textContent =
                data.version?.name_clean || "-";
        } else {
            status.textContent = "OFFLINE";
            box.classList.add("offline");

            players.textContent = "0/-";
            version.textContent = "-";
        }

    } catch (error) {
        status.textContent = "BŁĄD";
        box.classList.add("offline");

        players.textContent = "-";
        version.textContent = "-";
    }

    updated.textContent =
        new Date().toLocaleTimeString("pl-PL");
}

function copyIP() {
    navigator.clipboard.writeText(SERVER).then(() => {
        const button = document.querySelector(".ip button");
        button.textContent = "Skopiowano!";

        setTimeout(() => {
            button.textContent = "Kopiuj";
        }, 1500);
    });
}

checkServer();
setInterval(checkServer, 5000);
</script>

</body>
</html>
